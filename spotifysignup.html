<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Sign up</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <link rel="stylesheet" href="spotifysignup.css" />
  </head>
  <body>
    <div class="container" style="align-items: center; justify-content: center">
      <div class="head">
        <img
          src="assets/spotify_logo_white-removebg-preview.png"
          alt=""
          class="logo"
        />
        <h1>
          <span style="padding-left: 60px"> Sign up to</span> <br />
          <span style="padding-left: 20px"> start listening</span>
        </h1>

        <label for="Phone">Phone Number</label>
        <div class="phone-field">
          <select name="country_code" id="country-code">
            <option value="+234">+234</option>
            <option value="+234">+20</option>
            <option value="+234">+212</option>
            <option value="+234">+213</option>
            <option value="+234">+234</option>
            <option value="+234">+254</option>
            <option value="+234">+255</option>
            <option value="+234">+27</option>
            <option value="+234">+51</option>
            <option value="+234">+54</option>
          </select>
          <input type="tel" id="phone" name="phone" />
        </div>
      </div>

      <div class="buttons">
        <button class="continue">Continue</button><br />
        <p class="or">or</p>
        <button class="btn-1">
          <span class="cwpn">
            <span class="material-symbols-outlined"> mail </span>
            <span style="margin-right: 20px">Sign-up with E mail</span></span
          >
        </button>
        <button class="btn-1">
          <span class="cwpn">
            <img
              src="assets/google-logo-removebg-preview.png"
              alt=""
              width="23"
              class="google"
            />
            <span>Sign-up with Google</span></span
          >
        </button>

        <button class="btn-1">
          <span class="cwpn">
            <img
              src="assets/apple_logo-removebg-preview.png"
              alt=""
              width="32"
              class="apple"
            />
            <span>Sign-up with Apple</span></span
          >
        </button>
      </div>

      <div class="footer">
        <p class="p-1">Already on spotify?</p>
        <p class="p-2">
          <a
            href="spotifylogin.html"
            style="color: white; text-decoration: none"
            >Log in</a
          >
        </p>
        <p class="p-3">
          This site is protected by reCAPTCHA and the Google
          <a href="" style="color: #7e7e7e">Privacy</a><br />
          <span class="span-1">
            <a href="" style="color: #7e7e7e">Policy</a> and
            <a href="" style="color: #7e7e7e">Terms of service</a>apply</span
          >
        </p>
      </div>
    </div>
  </body>
</html>
